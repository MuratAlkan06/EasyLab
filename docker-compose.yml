services:
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file: ./apps/web/.env.local
    volumes:
      - ./apps/web:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - worker

  worker:
    build:
      context: ./apps/worker
      dockerfile: Dockerfile
    # Override the production CMD to enable hot-reload during local dev. The
    # worker_loop supervisor (PR #29) self-heals from transient claim errors
    # so reload no longer causes the silent-wedge symptom that plagued us
    # before. Production (Fly.io) inherits the Dockerfile CMD without --reload.
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    ports:
      - "8000:8000"
    env_file: ./apps/worker/.env
    volumes:
      - ./apps/worker:/app
